evaluation:
  objective_satisfaction: pass | partial
  execution_quality: pass
  architecture_stability: pass
  governance_compliance: pass
  validation_status: passed | partial
  evidence:
    - before and after routing file map
    - adapter references reviewed
    - validator output
  validation_gap:
    - live agent behavior may still require manual review
  residual_risk:
    - downstream users may depend on old file paths
  required_correction:
    - document migration if paths change
  follow_up_required: true
