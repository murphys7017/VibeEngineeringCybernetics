evaluation:
  objective_satisfaction: pass | partial
  execution_quality: pass
  architecture_stability: not_applicable
  governance_compliance: pass
  validation_status: passed | partial
  evidence:
    - command output
    - validator output
    - inspected implementation files
  validation_gap:
    - route inference may need examples for full confidence
  residual_risk:
    - command semantics may need refinement after real use
  required_correction: []
  follow_up_required: true
